apiVersion: 1

datasources:
  - access: proxy
    isDefault: true
    name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
  - access: proxy
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: trace_id=(\w+)
          name: TraceID
          url: $${__value.raw}
    name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
  - access: proxy
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
    name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
